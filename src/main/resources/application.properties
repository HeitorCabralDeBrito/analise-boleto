# Boleto Seguro — configuração versionada. NÃO coloque segredos neste arquivo.
#
# Segredos e ajustes de cada ambiente vêm de variáveis de ambiente (nuvem) ou de config/application.properties
# (sua máquina, fora do Git; o Spring Boot carrega esse arquivo por cima deste). Modelo: config/application.properties.example
#
# Variáveis de ambiente usadas:
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD   banco PostgreSQL
#   JWT_SECRET                                        chave de assinatura do login (mínimo 32 caracteres)
#   OPENAI_API_KEY                                    opcional: leitura difícil e explicação reescrita por IA
#   TESSERACT_CAMINHO                                 opcional: caminho do Tesseract (sem ele, o OCR local é pulado)
#   CORS_ORIGENS                                      opcional: outros endereços que podem chamar a API
#   PORT                                              porta HTTP (o Render define sozinho)

# === BANCO DE DADOS ===
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:boleto_seguro}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Poucas conexões: o plano gratuito da nuvem tem pouca memória
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# Tabelas criadas pelas migrações do Flyway (db/migration); o Hibernate só confere se batem com as entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === SERVIDOR ===
server.port=${PORT:8080}
# Atrás do proxy HTTPS da nuvem: respeita X-Forwarded-Proto/Host
server.forward-headers-strategy=framework
# Respostas de erro sem detalhes internos (pilha, mensagens de exceção)
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
server.compression.enabled=true

# === LOGIN (JWT) ===
boleto.seguro.jwt.secret=${JWT_SECRET:}
boleto.seguro.jwt.expiration-ms=86400000

# === UPLOAD DE ARQUIVOS ===
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# === OCR LOCAL (Tesseract — opcional) ===
boleto.seguro.tesseract.caminho=${TESSERACT_CAMINHO:C:/Program Files/Tesseract-OCR/tesseract.exe}

# === OPENAI (opcional) ===
# A chave vem da variável de ambiente OPENAI_API_KEY. Sem ela, tudo funciona sem IA.
boleto.seguro.openai.api-key=${OPENAI_API_KEY:}
boleto.seguro.openai.model=gpt-4o-mini
# Leitura de imagens difíceis (boleto borrado, print pequeno): modelo com visão melhor
boleto.seguro.openai.model-leitura=gpt-4o

# === CORS ===
boleto.seguro.cors.origens=${CORS_ORIGENS:http://localhost:8080,http://127.0.0.1:8080}

# === LOGS ===
logging.level.br.com.bradesco=INFO
logging.level.org.springframework.security=WARN
