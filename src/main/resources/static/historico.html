<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico — Boleto Seguro</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <script src="/js/tema.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/boleto-seguro.css">
</head>
<body data-pagina="historico">
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<header class="app-topo" id="app-topo"></header>
<div class="app-corpo">
  <nav class="app-menu" id="app-menu" aria-label="Menu principal"></nav>
  <main class="app-principal" id="conteudo" tabindex="-1">
    <div class="app-conteudo">

      <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
        <h1 class="titulo-pagina mb-0">Seus boletos analisados</h1>
        <a href="/pagar-boleto.html" class="btn-primario">+ Analisar novo boleto</a>
      </div>

      <!-- Filtros -->
      <section class="cartao mb-3" aria-label="Filtros do histórico">
        <div class="cartao__corpo py-3">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-sm-3">
              <label for="filtro-pago" class="form-label small mb-1">Situação</label>
              <select id="filtro-pago" class="form-select campo" onchange="filtrar()">
                <option value="">Todos</option>
                <option value="PAGO">Pagos</option>
                <option value="NAO_PAGO">Não pagos</option>
              </select>
            </div>
            <div class="col-12 col-sm-3">
              <label for="filtro-risco" class="form-label small mb-1">Risco</label>
              <select id="filtro-risco" class="form-select campo" onchange="filtrar()">
                <option value="">Todos</option>
                <option value="BAIXO">Baixo</option>
                <option value="MEDIO">Médio</option>
                <option value="ALTO">Alto</option>
              </select>
            </div>
            <div class="col-12 col-sm-6">
              <label for="filtro-busca" class="form-label small mb-1">Buscar</label>
              <input type="search" id="filtro-busca" class="form-control campo"
                placeholder="Linha digitável ou beneficiário" oninput="filtrar()">
            </div>
          </div>
        </div>
      </section>

      <!-- Loading -->
      <div id="loading-hist" class="text-center py-4" role="status">
        <div class="loading-spinner mx-auto" aria-hidden="true"></div>
        <div class="mt-2 text-muted small">Carregando histórico...</div>
      </div>

      <!-- Lista vazia -->
      <div id="sem-historico" class="cartao d-none">
        <div class="cartao__corpo text-center py-4">
          <div class="mb-2" style="font-size:2rem;" aria-hidden="true">📋</div>
          <div class="fw-semibold">Nenhum boleto analisado ainda</div>
          <div class="small text-muted mt-1">Seus boletos analisados aparecerão aqui</div>
          <a href="/pagar-boleto.html" class="btn-primario mt-3">Analisar meu primeiro boleto</a>
        </div>
      </div>

      <!-- Quantidade de resultados, anunciada a leitores de tela ao filtrar -->
      <p id="contagem-historico" class="visually-hidden" aria-live="polite"></p>

      <!-- Lista de boletos -->
      <ul id="lista-historico" class="list-unstyled mb-0"></ul>

    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
  if (!API.requireAuth()) {}

  let todosItens = [];

  const niveisLabel = { BAIXO: 'Risco baixo', MEDIO: 'Risco médio', ALTO: 'Risco alto' };
  const niveisSelo = { BAIXO: 'selo-baixo', MEDIO: 'selo-medio', ALTO: 'selo-alto' };
  const tiposLabel = { MANUAL: 'Manual', IMAGEM: 'Imagem', PDF: 'PDF' };

  async function carregarHistorico() {
    const { ok, data } = await API.historico();
    document.getElementById('loading-hist').classList.add('d-none');

    if (!ok || !data.length) {
      document.getElementById('sem-historico').classList.remove('d-none');
      return;
    }

    todosItens = data;
    renderizar(data);
  }

  function filtrar() {
    const risco = document.getElementById('filtro-risco').value;
    const situacao = document.getElementById('filtro-pago').value;
    const busca = document.getElementById('filtro-busca').value.toLowerCase();

    const filtrados = todosItens.filter(item => {
      const matchRisco = !risco || item.nivelRisco === risco;
      const matchSituacao = !situacao || (situacao === 'PAGO') === item.pago;
      const matchBusca = !busca ||
        (item.linhaDigitavel || '').toLowerCase().includes(busca) ||
        (item.nomeBeneficiario || '').toLowerCase().includes(busca);
      return matchRisco && matchSituacao && matchBusca;
    });

    renderizar(filtrados);
  }

  function renderizar(itens) {
    const lista = document.getElementById('lista-historico');
    lista.innerHTML = '';
    document.getElementById('contagem-historico').textContent =
      itens.length === 1 ? '1 boleto encontrado.' : `${itens.length} boletos encontrados.`;

    if (!itens.length) {
      lista.innerHTML = '<li class="text-center text-muted py-3 small">Nenhum resultado para os filtros selecionados.</li>';
      return;
    }

    const e = Html.escapar;
    itens.forEach(item => {
      const data = new Date(item.dataSubmissao).toLocaleDateString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });

      const riscoSelo = niveisSelo[item.nivelRisco] || 'selo-neutro';
      const riscoLabel = niveisLabel[item.nivelRisco] || item.nivelRisco;
      const tipoLabel = tiposLabel[item.tipoEntrada] || item.tipoEntrada;

      // Pago com risco alto fica em vermelho: o usuário ignorou o alerta
      const situacao = !item.pago
        ? { texto: 'Não pago', selo: 'selo-neutro' }
        : item.nivelRisco === 'ALTO'
          ? { texto: '✓ Pago apesar do risco alto', selo: 'selo-alto' }
          : { texto: '✓ Pago', selo: 'selo-baixo' };

      const li = document.createElement('li');
      li.className = 'historico-item';
      li.innerHTML = `
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <span class="selo ${riscoSelo}">${e(riscoLabel)}</span>
            <span class="historico-score ${'score-' + (item.nivelRisco || '').toLowerCase()}">${e(item.score)}<small>/100</small></span>
            <span class="selo selo-entrada">${e(tipoLabel)}</span>
            <span class="selo ${situacao.selo}">${situacao.texto}</span>
          </div>
          <div class="text-muted small">${e(data)}</div>
        </div>
        <div class="historico-linha mb-2">${e(item.linhaDigitavel || '—')}</div>
        <div class="row g-1 small">
          <div class="col-auto text-muted">Beneficiário:</div>
          <div class="col fw-semibold">${e(item.nomeBeneficiario || 'Não informado')}</div>
          <div class="w-100"></div>
          <div class="col-auto text-muted">Valor:</div>
          <div class="col">${e(item.valor || '—')}</div>
          <div class="col-auto text-muted ms-2">Vencimento:</div>
          <div class="col">${e(item.vencimento || '—')}</div>
          ${item.origem ? `<div class="w-100"></div><div class="col-auto text-muted">Origem:</div><div class="col">${e(item.origem.toLowerCase())}</div>` : ''}
        </div>
      `;
      // Explicação salva na análise (análises feitas antes desta versão não têm)
      if (item.explicacao) {
        const detalhes = document.createElement('details');
        detalhes.className = 'mt-2 small';
        detalhes.innerHTML = '<summary>Ver explicação</summary>';
        const texto = document.createElement('p');
        texto.className = 'mb-0 mt-1';
        texto.style.whiteSpace = 'pre-line';
        texto.textContent = item.explicacao;
        detalhes.appendChild(texto);
        li.appendChild(detalhes);
      }
      lista.appendChild(li);
    });
  }

  carregarHistorico();
</script>
</body>
</html>
