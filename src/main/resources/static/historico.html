<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boleto Seguro — Histórico</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/boleto-seguro.css">
</head>
<body>

<nav class="navbar-bradesco">
  <div class="container d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <a href="/home.html" style="color:rgba(255,255,255,0.7); text-decoration:none; font-size:1.1rem;">&#8592;</a>
      <span class="navbar-brand mb-0">Histórico de análises</span>
      <span class="badge-prototipo">Protótipo acadêmico</span>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span class="usuario-info d-none d-sm-inline">Olá, <b id="usuario-nome"></b></span>
      <button class="btn-logout" id="btn-logout">Sair</button>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width:720px;">

  <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
    <h5 class="mb-0 fw-bold">Seus boletos analisados</h5>
    <a href="/pagar-boleto.html" class="btn-bradesco-primary text-decoration-none px-3 py-2 d-inline-block" style="font-size:0.88rem;">
      + Analisar novo boleto
    </a>
  </div>

  <!-- Filtros -->
  <div class="card-bradesco mb-3">
    <div class="card-body py-2 px-3">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-sm-3">
          <label class="form-label small mb-1">Situação:</label>
          <select id="filtro-pago" class="form-select form-select-sm" onchange="filtrar()">
            <option value="">Todos</option>
            <option value="PAGO">Pagos</option>
            <option value="NAO_PAGO">Não pagos</option>
          </select>
        </div>
        <div class="col-12 col-sm-3">
          <label class="form-label small mb-1">Risco:</label>
          <select id="filtro-risco" class="form-select form-select-sm" onchange="filtrar()">
            <option value="">Todos</option>
            <option value="BAIXO">Baixo</option>
            <option value="MEDIO">Médio</option>
            <option value="ALTO">Alto</option>
          </select>
        </div>
        <div class="col-12 col-sm-6">
          <label class="form-label small mb-1">Buscar:</label>
          <input type="text" id="filtro-busca" class="form-control form-control-sm"
            placeholder="Linha digitável ou beneficiário" oninput="filtrar()">
        </div>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading-hist" class="text-center py-4">
    <div class="loading-spinner mx-auto"></div>
    <div class="mt-2 text-muted small">Carregando histórico...</div>
  </div>

  <!-- Lista vazia -->
  <div id="sem-historico" class="card-bradesco d-none">
    <div class="card-body text-center py-4">
      <div class="text-muted mb-2" style="font-size:2rem;">📋</div>
      <div class="fw-semibold">Nenhum boleto analisado ainda</div>
      <div class="small text-muted mt-1">Seus boletos analisados aparecerão aqui</div>
      <a href="/pagar-boleto.html" class="btn-bradesco-primary mt-3 d-inline-block text-decoration-none px-4 py-2" style="font-size:0.88rem;">
        Analisar meu primeiro boleto
      </a>
    </div>
  </div>

  <!-- Lista de boletos -->
  <div id="lista-historico"></div>

</div>

<script src="/js/api.js"></script>
<script>
  if (!API.requireAuth()) {}

  let todosItens = [];

  const niveisLabel = { BAIXO: 'Baixo', MEDIO: 'Médio', ALTO: 'Alto' };
  const niveisCor = { BAIXO: '#198754', MEDIO: '#fd7e14', ALTO: '#dc3545' };
  const niveisBg = { BAIXO: '#d1fae5', MEDIO: '#fff3cd', ALTO: '#fee2e2' };
  const tiposLabel = { MANUAL: 'Manual', IMAGEM: 'Imagem', PDF: 'PDF' };

  async function carregarHistorico() {
    const { ok, data } = await API.historico();
    document.getElementById('loading-hist').classList.add('d-none');

    if (!ok || !data.length) {
      document.getElementById('sem-historico').classList.remove('d-none');
      return;
    }

    todosItens = data;
    renderizar(data);
  }

  function filtrar() {
    const risco = document.getElementById('filtro-risco').value;
    const situacao = document.getElementById('filtro-pago').value;
    const busca = document.getElementById('filtro-busca').value.toLowerCase();

    const filtrados = todosItens.filter(item => {
      const matchRisco = !risco || item.nivelRisco === risco;
      const matchSituacao = !situacao || (situacao === 'PAGO') === item.pago;
      const matchBusca = !busca ||
        (item.linhaDigitavel || '').toLowerCase().includes(busca) ||
        (item.nomeBeneficiario || '').toLowerCase().includes(busca);
      return matchRisco && matchSituacao && matchBusca;
    });

    renderizar(filtrados);
  }

  function renderizar(itens) {
    const lista = document.getElementById('lista-historico');
    lista.innerHTML = '';

    if (!itens.length) {
      lista.innerHTML = '<div class="text-center text-muted py-3 small">Nenhum resultado para os filtros selecionados.</div>';
      return;
    }

    itens.forEach(item => {
      const data = new Date(item.dataSubmissao).toLocaleDateString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });

      const riscoCor = niveisCor[item.nivelRisco] || '#666';
      const riscoBg = niveisBg[item.nivelRisco] || '#f5f5f5';
      const riscoLabel = niveisLabel[item.nivelRisco] || item.nivelRisco;
      const tipoLabel = tiposLabel[item.tipoEntrada] || item.tipoEntrada;

      // Pago com risco alto fica em vermelho: o usuário ignorou o alerta
      const situacao = !item.pago
        ? { texto: 'Não pago', cor: '#6c757d', bg: '#e9ecef' }
        : item.nivelRisco === 'ALTO'
          ? { texto: '✓ Pago apesar do risco alto', cor: '#dc3545', bg: '#fee2e2' }
          : { texto: '✓ Pago', cor: '#198754', bg: '#d1fae5' };

      const div = document.createElement('div');
      div.className = 'historico-item';
      div.innerHTML = `
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <span style="background:${riscoBg};color:${riscoCor};border-radius:20px;padding:3px 12px;font-size:0.78rem;font-weight:700;">
              ${riscoLabel}
            </span>
            <span style="font-size:1.3rem;font-weight:800;color:${riscoCor};">${item.score}<span style="font-size:0.7rem;font-weight:400;color:#999;">/100</span></span>
            <span class="badge-entrada badge-${(item.tipoEntrada || 'manual').toLowerCase()}">${tipoLabel}</span>
            <span style="background:${situacao.bg};color:${situacao.cor};border-radius:20px;padding:3px 12px;font-size:0.78rem;font-weight:700;">
              ${situacao.texto}
            </span>
          </div>
          <div class="text-muted" style="font-size:0.75rem;">${data}</div>
        </div>
        <div class="historico-linha mb-2">${item.linhaDigitavel || '—'}</div>
        <div class="row g-1" style="font-size:0.82rem;">
          <div class="col-auto text-muted">Beneficiário:</div>
          <div class="col fw-semibold">${item.nomeBeneficiario || 'Não informado'}</div>
          <div class="w-100"></div>
          <div class="col-auto text-muted">Valor:</div>
          <div class="col">${item.valor || '—'}</div>
          <div class="col-auto text-muted ms-2">Vencimento:</div>
          <div class="col">${item.vencimento || '—'}</div>
          ${item.origem ? `<div class="w-100"></div><div class="col-auto text-muted">Origem:</div><div class="col">${item.origem.toLowerCase()}</div>` : ''}
        </div>
      `;
      // Explicação salva na análise (análises feitas antes desta versão não têm)
      if (item.explicacao) {
        const detalhes = document.createElement('details');
        detalhes.className = 'mt-2';
        detalhes.style.fontSize = '0.82rem';
        detalhes.innerHTML = '<summary class="text-bradesco fw-semibold" style="cursor:pointer;">Ver explicação</summary>';
        const texto = document.createElement('p');
        texto.className = 'mb-0 mt-1';
        texto.style.whiteSpace = 'pre-line';
        texto.textContent = item.explicacao;
        detalhes.appendChild(texto);
        div.appendChild(detalhes);
      }
      lista.appendChild(div);
    });
  }

  carregarHistorico();
</script>
</body>
</html>
