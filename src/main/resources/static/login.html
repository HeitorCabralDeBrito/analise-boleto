<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boleto Seguro — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/boleto-seguro.css">
</head>
<body>
<div class="login-wrapper">
  <div class="container px-3">
    <div class="login-card">

      <div class="login-logo">
        <div class="logo-circle">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
            <path d="M9 8h2v8H9zm4 0h2v8h-2z" style="fill:rgba(255,255,255,0.6)"/>
            <circle cx="12" cy="12" r="10" fill="none"/>
            <path d="M20 12c0-4.42-3.58-8-8-8S4 7.58 4 12s3.58 8 8 8 8-3.58 8-8zm-8 6c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z" fill="rgba(255,255,255,0.3)"/>
          </svg>
        </div>
        <h1>Boleto Seguro</h1>
        <div class="mt-1">
          <span class="badge-academico">Protótipo acadêmico — Anhembi Morumbi × Bradesco</span>
        </div>
      </div>

      <div id="erro-login" class="alert alert-danger d-none" role="alert"></div>

      <form id="form-login" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Agência</label>
          <input type="text" id="agencia" class="form-control form-control-bradesco"
            placeholder="Ex: 0001" maxlength="4" inputmode="numeric" autocomplete="off" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">Conta</label>
          <input type="text" id="conta" class="form-control form-control-bradesco"
            placeholder="Ex: 12345-6" maxlength="7" inputmode="numeric" autocomplete="off" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold small">Senha</label>
          <div class="input-group">
            <input type="password" id="senha" class="form-control form-control-bradesco"
              placeholder="Sua senha" autocomplete="current-password" required>
            <button type="button" class="btn btn-outline-secondary" id="btn-ver-senha"
              style="border-radius:0 8px 8px 0; border-color: var(--bradesco-gray-mid)">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-bradesco-primary" id="btn-entrar">
          <span id="btn-texto">Entrar</span>
          <span id="btn-loading" class="d-none">
            <span class="spinner-border spinner-border-sm me-2"></span>Aguarde...
          </span>
        </button>
      </form>

      <div class="mt-4 p-3 rounded" style="background:#f8f9fa; font-size:0.8rem;">
        <div class="fw-semibold mb-1 text-muted">Usuários de demonstração:</div>
        <div>Ag: <b>0001</b> &nbsp; Conta: <b>12345-6</b> &nbsp; Senha: <b>senha123</b></div>
        <div>Ag: <b>0001</b> &nbsp; Conta: <b>98765-4</b> &nbsp; Senha: <b>senha456</b></div>
      </div>

    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  // Se já logado, vai para home
  if (API.getToken()) window.location.href = '/home.html';

  Mascara.aplicar(document.getElementById('agencia'), 'agencia');
  Mascara.aplicar(document.getElementById('conta'), 'conta');

  document.getElementById('btn-ver-senha').addEventListener('click', () => {
    const input = document.getElementById('senha');
    input.type = input.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const agencia = document.getElementById('agencia').value.trim();
    const conta = document.getElementById('conta').value.trim();
    const senha = document.getElementById('senha').value;
    const erroEl = document.getElementById('erro-login');

    if (!agencia || !conta || !senha) {
      erroEl.textContent = 'Preencha todos os campos.';
      erroEl.classList.remove('d-none');
      return;
    }

    document.getElementById('btn-texto').classList.add('d-none');
    document.getElementById('btn-loading').classList.remove('d-none');
    document.getElementById('btn-entrar').disabled = true;
    erroEl.classList.add('d-none');

    const { ok, data } = await API.login(agencia, conta, senha);

    if (ok) {
      window.location.href = '/home.html';
    } else {
      erroEl.textContent = data.erro || 'Credenciais inválidas. Tente novamente.';
      erroEl.classList.remove('d-none');
      document.getElementById('btn-texto').classList.remove('d-none');
      document.getElementById('btn-loading').classList.add('d-none');
      document.getElementById('btn-entrar').disabled = false;
    }
  });
</script>
</body>
</html>
