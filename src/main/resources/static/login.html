<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Boleto Seguro</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <script src="/js/tema.js"></script>
  <script src="/js/preferencias.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/boleto-seguro.css">
</head>
<body>
<main class="login-pagina">
  <div class="login-acess">
    <div id="login-preferencias"></div>
    <a href="/acessibilidade.html">Acessibilidade</a>
  </div>
  <div class="login-card">

    <div class="login-logo">
      <h1 class="visually-hidden">Entrar no Boleto Seguro</h1>
      <div id="login-marca"></div>
      <span class="badge-academico" id="login-aviso">Protótipo acadêmico — nenhuma transação financeira real</span>
    </div>

    <div id="erro-login" class="alert alert-danger d-none" role="alert"></div>

    <form id="form-login" novalidate>
      <div class="mb-3">
        <label for="agencia" class="form-label fw-semibold">Agência</label>
        <input type="text" id="agencia" class="form-control campo"
          placeholder="Ex: 0001" maxlength="4" inputmode="numeric" autocomplete="off" required aria-describedby="erro-login">
      </div>
      <div class="mb-3">
        <label for="conta" class="form-label fw-semibold">Conta</label>
        <input type="text" id="conta" class="form-control campo"
          placeholder="Ex: 12345-6" maxlength="7" inputmode="numeric" autocomplete="off" required aria-describedby="erro-login">
      </div>
      <div class="mb-4">
        <label for="senha" class="form-label fw-semibold">Senha</label>
        <div class="input-group">
          <input type="password" id="senha" class="form-control campo"
            placeholder="Senha de demonstração" autocomplete="current-password" required aria-describedby="erro-login">
          <button type="button" class="btn btn-contorno" id="btn-ver-senha" aria-pressed="false"
            style="border-radius:0 var(--radius-sm) var(--radius-sm) 0;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
              <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
            </svg>
            <span class="visually-hidden">Mostrar senha</span>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primario btn-bloco" id="btn-entrar">
        <span id="btn-texto">Entrar</span>
        <span id="btn-loading" class="d-none">
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Aguarde...
        </span>
      </button>
    </form>

    <div class="login-demo">
      <p class="fw-semibold mb-1">Usuários de demonstração (fictícios):</p>
      <div>Ag: <b>0001</b> &nbsp; Conta: <b>12345-6</b> &nbsp; Senha: <b>senha123</b></div>
      <div>Ag: <b>0001</b> &nbsp; Conta: <b>98765-4</b> &nbsp; Senha: <b>senha456</b></div>
      <p class="mt-2 mb-0 text-muted">Nunca digite aqui a senha da sua conta bancária real.</p>
    </div>

  </div>

  <!-- Aparece só quando os logotipos acadêmicos estão disponíveis no servidor -->
  <fieldset class="seletor-tema d-none" id="seletor-tema">
    <legend>Identidade visual:</legend>
    <div class="seletor-tema__opcoes">
      <label><input type="radio" name="tema" value="proprio"> Boleto Seguro</label>
      <label><input type="radio" name="tema" value="academico"> Bradesco (acadêmico)</label>
    </div>
  </fieldset>
</main>

<script src="/js/api.js"></script>
<script>
  // Se já logado, vai para home
  if (API.getToken()) window.location.href = '/home.html';

  function renderizarMarca() {
    const academico = Tema.atual() === 'academico';
    document.getElementById('login-marca').innerHTML = academico
      ? '<img src="/marca-academica/logo-horizontal.png" class="logo-bradesco" alt="Bradesco">' +
        '<p class="login-logo__produto">Boleto Seguro</p>'
      : '<img src="/img/logo-boleto-seguro.svg" class="logo-proprio" alt="Boleto Seguro">';
    document.getElementById('login-aviso').textContent = academico
      ? 'Protótipo acadêmico — Anhembi Morumbi × Bradesco. Nenhuma transação financeira real.'
      : 'Protótipo acadêmico — nenhuma transação financeira real';
    document.querySelectorAll('input[name="tema"]').forEach((r) => { r.checked = r.value === Tema.atual(); });
  }
  renderizarMarca();
  document.addEventListener('temachange', renderizarMarca);
  Preferencias.montarControles(document.getElementById('login-preferencias'));

  Tema.config.then((cfg) => {
    if (cfg.academicoDisponivel) document.getElementById('seletor-tema').classList.remove('d-none');
  });
  document.querySelectorAll('input[name="tema"]').forEach((r) =>
    r.addEventListener('change', () => Tema.definir(r.value)));

  Mascara.aplicar(document.getElementById('agencia'), 'agencia');
  Mascara.aplicar(document.getElementById('conta'), 'conta');

  document.getElementById('btn-ver-senha').addEventListener('click', (e) => {
    const input = document.getElementById('senha');
    const mostrar = input.type === 'password';
    input.type = mostrar ? 'text' : 'password';
    e.currentTarget.setAttribute('aria-pressed', String(mostrar));
  });

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    const agencia = document.getElementById('agencia').value.trim();
    const conta = document.getElementById('conta').value.trim();
    const senha = document.getElementById('senha').value;
    const erroEl = document.getElementById('erro-login');

    // Campos vazios ficam marcados (aria-invalid) e o foco vai para o primeiro deles
    const vazios = ['agencia', 'conta', 'senha'].filter((id) => !document.getElementById(id).value.trim());
    ['agencia', 'conta', 'senha'].forEach((id) =>
      document.getElementById(id).setAttribute('aria-invalid', String(vazios.includes(id))));
    if (vazios.length) {
      erroEl.textContent = 'Preencha todos os campos.';
      erroEl.classList.remove('d-none');
      document.getElementById(vazios[0]).focus();
      return;
    }

    document.getElementById('btn-texto').classList.add('d-none');
    document.getElementById('btn-loading').classList.remove('d-none');
    document.getElementById('btn-entrar').disabled = true;
    erroEl.classList.add('d-none');

    const { ok, data } = await API.login(agencia, conta, senha);

    if (ok) {
      window.location.href = '/home.html';
    } else {
      erroEl.textContent = data.erro || 'Credenciais inválidas. Tente novamente.';
      erroEl.classList.remove('d-none');
      document.getElementById('btn-texto').classList.remove('d-none');
      document.getElementById('btn-loading').classList.add('d-none');
      document.getElementById('btn-entrar').disabled = false;
    }
  });
</script>
</body>
</html>
